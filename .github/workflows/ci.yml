name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"  # weekly: new advisories show up between pushes

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      # GPU packages are win32-only, so this installs only what the scoring tests need.
      - run: uv sync --frozen
      - run: uv run pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv export --frozen --format requirements-txt --no-emit-project --all-groups -o requirements-audit.txt
      - run: uvx pip-audit==2.10.1 -r requirements-audit.txt --disable-pip --strict
      # Linux skips win32-only pins: audit them at base versions (+cu134 isn't on PyPI). Fail if any is missing.
      - run: |
          grep -E "^[a-z0-9-]+==[^ ]+ ; sys_platform == 'win32'" requirements-audit.txt | sed -E 's/\+[a-z0-9]+//; s/ ;.*//' > requirements-win.txt
          grep -q '^torch==' requirements-win.txt
          grep -q '^accelerate==' requirements-win.txt
          grep -q '^bitsandbytes==' requirements-win.txt
      - run: uvx pip-audit==2.10.1 -r requirements-win.txt --no-deps --disable-pip --strict

  # gitleaks CLI, not gitleaks-action: on push the action scans only the pushed range (and fails on a root commit).
  # `gitleaks git` scans every commit in the history. Same version as the pre-commit hook; tarball hash pinned.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the full history, which the scan below covers
      - run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
      - run: |
          echo "Commits in history: $(git rev-list --count HEAD)"
          "$RUNNER_TEMP/gitleaks" git --redact -v --no-banner .
